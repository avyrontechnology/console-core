name: Build

on:
  push:
    branches:
      - master
      - feature--dev--2025
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "1234"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "240"
      MAILMG_NO_REPLY_CHANNEL_KEY: "your-mailmg-no-reply-channel-key"
      RAZORPAY_WEBHOOK_SECRET: "jaggerbomb"
      FIREBASE_CREDENTIALS_JSON : "{}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      - name: Show submodules
        run: git submodule status

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests with coverage
        run: |
          poetry run coverage run --rcfile=.coveragerc -m pytest -v

      - name: Generate coverage report
        run: |
          poetry run coverage xml --rcfile=.coveragerc -o coverage.xml
          poetry run coverage report -m
          echo "=== COVERAGE DEBUG ==="
          echo "Source root in XML:"
          grep -m 1 -A 1 '<source>' coverage.xml
          echo "Sample covered files:"
          grep 'filename="src/' coverage.xml | head -5 || echo "No src/ paths"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: ./

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: |
            -Dsonar.projectKey=MakunaiGlobal_console-service
            -Dsonar.organization=makunaiglobal
            -Dsonar.sources=src
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/tests/**,**/migrations/**,**/setup.py,**/scripts/**,**/alembic/**,**/protos/**,**/pub/**,**/controllers.py,**/grpc_interceptors/**,**/rpc_main.py,**/controller.py
            -Dsonar.issue.ignore.multicriteria=e1
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=python:S5720
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**/controllers.py