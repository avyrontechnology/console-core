syntax = "proto3";

package auth;

// The authentication service definition.
service AuthService {
    // RPC to validate a token and return user information.
    rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);

    // RPC to get the list of child users for a given user.
    rpc GetUserChildHierarchy (GetUserChildHierarchyRequest) returns (GetUserChildHierarchyResponse);

    // RPC to get the list of child users for a given user along with their directory information.
    rpc GetUserChildDetails (GetUserChildDetailsRequest) returns (GetUserChildDetailsResponse);

    // RPC to get CurrentUserDetails.
    rpc GetUserDetails (GetUserDetailsRequest) returns (GetUserDetailsResponse);

    // RPC to get list of permission for given user.
    rpc GetUserPermissions (GetUserPermissionsRequest) returns (GetUserPermissionsResponse);

    // RPC to get User role
    rpc GetUserRole (GetUserRoleRequest) returns (GetUserRoleResponse);

    // RPC to resolve a user's effective role WITHIN a team (team override if
    // set, else the user's global role) together with that role's permissions.
    rpc GetUserTeamRole (GetUserTeamRoleRequest) returns (GetUserTeamRoleResponse);

    // RPC to get the configured permission slugs granted to a specific role.
    rpc GetRolePermissions (GetRolePermissionsRequest) returns (GetRolePermissionsResponse);

    // RPC to get service board user details
    rpc GetServiceBoardUsersDetails(GetUsersDetailsRequest) returns (GetServiceBoardUserDetailsResponse);

    // RPC to get partner details.
    rpc GetPartnerDetails (GetPartnerDetailsRequest) returns (GetPartnerDetailsResponse);

    //RPC to get all active users on basis of partner ID
    rpc GetActiveUsersByPartnerId (GetUserDetailsByPartnerIdRequest) returns (GetUserDetailsByPartnerIdResponse);

    // RPC to get parent user details for a list of user IDs.
    rpc GetUserParentDetails (GetUserParentDetailsRequest) returns (GetUserParentDetailsResponse);

    // RPC to get partner metadata details
    rpc GetPartnerMetaDataDetails (GetPartnerMetaDataDetailsRequest) returns (GetPartnerMetaDataDetailsResponse);

    // RPC to get fetching wallet and transaction details
    rpc GetWalletTransactionHistory (GetWalletTransactionHistoryRequest) returns (GetWalletTransactionHistoryResponse);

    //RPC to get Partner API KEY
    rpc GetPartnerApiKey (GetPartnerApiKeyRequest) returns (GetPartnerApiKeyResponse);


    //RPC method to get User Parent Hierarchy
    rpc GetUserParentHierarchy (GetUserParentHierarchyRequest) returns (GetUserParentHierarchyResponse);

    //RPC method to fetch location data
    rpc GetCountriesByIds (GetCountriesByIdsRequest) returns (GetCountriesByIdsResponse);
    rpc GetStatesByIds    (GetStatesByIdsRequest)    returns (GetStatesByIdsResponse);
    rpc GetCitiesByIds    (GetCitiesByIdsRequest)    returns (GetCitiesByIdsResponse);

    rpc GetCountriesByNames (GetCountriesByNamesRequest) returns (GetCountriesByNamesResponse);
    rpc GetStatesByNames    (GetStatesByNamesRequest)    returns (GetStatesByNamesResponse);
    rpc GetCitiesByNames    (GetCitiesByNamesRequest)    returns (GetCitiesByNamesResponse);
    rpc GetAllRoles (GetAllRolesRequest) returns (GetAllRolesResponse);

    // Teams
    rpc GetUserTeams    (GetUserTeamsRequest)    returns (GetTeamsResponse);
    rpc GetPartnerTeams (GetPartnerTeamsRequest) returns (GetTeamsResponse);
    rpc GetTeamMembers  (GetTeamMembersRequest)  returns (GetTeamMembersResponse);
}

//  service for get partner meta data definitions
service PartnerMetaDataService{
    
    // RPC to get partner enabled services
    rpc GetPartnerServicesDetails (GetPartnerServiceRequest) returns (GetPartnerServiceDetailsResponse);

}
// Context message containing metadata for the request.
message MContext {
    string correlation_id = 1; // A unique ID to correlate requests.
}

// Body message containing the main request information.
message MBody {
    string token = 1; // The JWT token to validate.
}

// The request message for token validation.
message ValidateTokenRequest {
    MContext mcontext = 1; 
    MBody mbody = 2;       
}

// The response message for token validation.
message ValidateTokenResponse {
    string message = 1;              
    string correlation_id = 2;     
    bool is_active = 3;                
    string user_id = 4;            
    string session_id = 6;           
    int64 expires_in = 7;            
    string partner_id = 8;
    optional bool is_talko_enabled = 11;
    optional bool is_internal = 12;
    optional bool is_wallet_enabled = 13;
    optional bool is_obotaai_enabled = 15;

}

// UserDetail message representing a user's directory information.
message UserDetail {
    string user_id = 1;        // User's ID.
    string email = 2;         // Email of the child user.
    bool is_active = 3;       // Indicates whether the user is active (true) or inactive (false).
    bool is_suspended = 4;    // Indicates whether the user is suspended or not.
    string name = 5;          // Full name of the user.
    string role = 6;
    int64 role_hierarchy = 7;
    string current_status = 8;
}

// The request message for retrieving the child user list.
message GetUserChildDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    string user_id = 2;     // The current user's ID.
}

// The response message for the child user list.
message GetUserChildDetailsResponse {
    string message = 1;              // Response message.
    repeated UserDetail user_detail = 2; // Directory information of child users.
}

// The request message for retrieving child user hierarchies.
message GetUserChildHierarchyRequest {
    MContext mcontext = 1; // Metadata context.
    repeated string user_ids = 2; // List of user IDs.
}

// The response message for child user hierarchies.
message GetUserChildHierarchyResponse {
    string message = 1; // Response message.
    repeated ChildHierarchy child_hierarchy = 2; // List of child hierarchy details.
}

// Message for a single user’s child hierarchy.
message ChildHierarchy {
    string user_id = 1; // The input user ID.
    repeated string child_ids = 2; // List of child user IDs.
}

message UserProfile {
    string user_id = 1;        // User's ID.
    string name = 2;          // name of the user
    string email = 3;         // Email of the user.
    string partner_id = 4;     // Partner id of the user.
    int64 role_hierarchy_level=5; // role_hierarchy of the user.
    string partner_name = 6;  // Partner name of the user.
    bool is_talko_enabled = 9; // Indicates talko service is enabled
    string phone_number = 11; // user registered phone_number
    bool is_active = 12; // user is active
    bool is_email_verified = 13; // user is email verified
    bool is_phone_number_verified = 14; // user is phone number verified
    bool is_walkthrough_completed = 15; // user is walkthrough completed 
    string cloud_agent_number = 16; // user cloud agent number
    bool is_gsm_calling_enabled = 17; // user gsm calling enabled
    bool is_meeting_log_enabled =18;// meeting log enabled
    map<string, bool> show_popup = 19;
    bool can_view_contact = 20;
    bool can_view_organization = 21;
    bool enable_dialer = 22;
    string role_data_scope = 23; // data_scope of the user's effective role (ALL/SUBTREE/OWN)
    bool can_view_products = 24; // user can view products
    bool can_view_inventory = 25; // user can view inventory
    bool can_view_payment_history = 26; // user can view payment history
    bool can_view_report_management = 27; // user can view report management
    bool can_clone_service_board = 28; // user can clone a service board
    optional string role_name = 29; // Optional user role name
}

// The request for retrieving current user details
message GetUserDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    string user_id =2;       // The current user's ID.
}

message GetUserDetailsResponse {
    string message=1;
    UserProfile user_profile = 2; // user profile information.
}

message GetUserPermissionsRequest {
    string user_id = 1;  // user Id 
}

message GetUserPermissionsResponse {
    string message = 1;
    repeated string permissions = 2;  // List of user permission
}

message GetUserRoleRequest {
    string user_id = 1; // user_id
}

message GetUserRoleResponse {
    string message = 1;
    string role = 2;
    int64 hierarchy = 3;
}

message GetUserTeamRoleRequest {
    string user_id = 1; // user_id
    string team_id = 2; // team the user is acting within
}

message GetUserTeamRoleResponse {
    string message = 1;
    bool   is_member = 2;            // false => user is not a member of team_id
    string role = 3;                 // effective role slug (team override else global)
    int64  hierarchy = 4;            // effective role hierarchy
    string data_scope = 5;           // effective role data_scope (ALL/SUBTREE/OWN)
    repeated string permissions = 6; // permission slugs for the effective role
}

message GetRolePermissionsRequest {
    string role_id = 1; // role to fetch configured permissions for
}

message GetRolePermissionsResponse {
    string message = 1;
    repeated string permissions = 2; // permission slugs configured for the role
}

// The request message for retrieving user list ids.
message GetUsersDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    repeated string user_ids = 2;     // List of user's ID.
    bool show_inactive_users =3;     //active and inactive filter.
}

// The response message for the child user list.
message GetServiceBoardUserDetailsResponse {
    string message = 1;              // Response message.
    repeated UserDetail user_detail = 2; // Directory information of child users.
}

// The request message for retrieving partner details.
message GetPartnerDetailsRequest {
    MContext mcontext = 1; // Metadata context.
    string partner_id = 2;  // The partner's ID.
}

// The response message for partner details.
message GetPartnerDetailsResponse {
    string message = 1;              // Response message.
    PartnerDetail partner_detail = 2; // Partner information.
}

message ServiceSubscriptionStatus {
    string status = 1;
    optional int64 entitlement_start_date = 2;
    optional int64 entitlement_end_date = 3;
    optional int64 grace_start_date = 4;       // only populated when status == "grace"
    optional int64 grace_end_date = 5;          // only populated when status == "grace"
}

// PartnerDetail message representing a partner's information.
message PartnerDetail {
    string partner_id = 1;           // Partner's ID.
    string name = 2;                // Name of the partner.
    bool is_active = 3;             // Indicates whether the partner is active.
    string partner_status = 5;      // Status of the partner (enum value as string).
    string partner_logo = 6;        // URL of the partner's logo.
    int64 created_at = 7;           // Creation date of the partner.
    bool is_feedback_enabled = 10;  // Indicates whether feedback is enabled for the partner.
    bool is_publisher_onboarding_completed = 11;  // Indicates whether publisher onboarding is completed or not.
    map<string, ServiceSubscriptionStatus> subscription_status = 12;
    int64 active_license = 13;  // Active liscense of partner
    string company_legal_name = 14; // Legal company name
    string cin_no = 15;             // CIN number
    string gst_no = 16;             // GST number
}

//Active User details
message ActiveUserDetails {
    string id = 1;
    string name = 2;
    string email = 3;
    string phone_number = 4;
    string role = 5;
    int64 role_hierarchy = 6;
    string role_data_scope = 7;
}

//Get user details by partner id request
message GetUserDetailsByPartnerIdRequest {
    string partner_id = 1;
}

//Get user details by partner id request
message GetUserDetailsByPartnerIdResponse {
    string message = 1;
    repeated ActiveUserDetails users = 2;
}

// The request message for retrieving parent user details.
message GetUserParentDetailsRequest {
    repeated string user_ids = 1; // List of user IDs.
}

// The response message for parent user details.
message GetUserParentDetailsResponse {
    string message = 1; // Response message.
    repeated UserParentDetail user_details = 2; // List of user parent details.
}

// Message for a single user's parent details.
message UserParentDetail {
    string user_id = 1; // The input user ID.
    string name = 2; // Name of the user.
    string parent_id = 3; // The parent user ID.
    string parent_name = 4; // Name of the parent user.
}


