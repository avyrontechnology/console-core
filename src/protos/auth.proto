// Request to fetch wallet & transaction history
message GetWalletTransactionHistoryRequest {
    MContext mcontext = 1;         // Metadata context
    string partner_id = 2;          // Partner ID
    optional string service_name = 3; // Optional: Service name (Talko, Obotaai)
    optional string transaction_type = 4; // Optional: CREDIT, DEBIT, FREEZE, UNFREEZE
}

// Response containing wallet info and list of transactions
message GetWalletTransactionHistoryResponse {
    string message = 1;                // Response message
    WalletDetail wallet_detail = 2;    // Wallet summary details
    repeated TransactionDetail transactions = 3; // List of transactions
}

// Wallet summary information
message WalletDetail {
    string wallet_id = 1;           // Wallet ID
    double balance = 2;            // Current balance
    double frozen_balance = 3;     // Frozen balance
    string currency = 4;           // Currency type (e.g., INR, USD)
}

// Transaction information
message TransactionDetail {
    string id = 1;                  // Transaction ID
    double amount = 2;             // Transaction amount
    string service_name = 3;       // Service name
    string transaction_type = 4;   // Transaction type (CREDIT, DEBIT, etc.)
    string remarks = 5;            // Remarks or description
    string created_at = 6;         // Created timestamp (ISO string)
}


message GetPartnerApiKeyRequest{
    string partner_id = 1;
}

message GetPartnerApiKeyResponse{
    string api_key = 1;
}

message GetUserParentHierarchyRequest {
    string user_id = 1;
}

message ParentUser {
    string user_id = 1;
    string name = 2;
    string role = 3;
    int64 role_hierarchy = 4;
}

message GetUserParentHierarchyResponse {
    string message = 1;
    repeated ParentUser parents = 2;
}

// Countries
message GetCountriesByIdsRequest {
    repeated string ids = 1;
}

message CountryDetail {
    string id = 1;
    string name = 2;
    string slug = 3;
}

message GetCountriesByIdsResponse {
    string                 message   = 1;
    repeated CountryDetail countries = 2;
}

// States
message GetStatesByIdsRequest {
    repeated string ids = 1;
}

message StateDetail {
    string id = 1;
    string name       = 2;
    string slug       = 3;
    string country_id = 4;
}

message GetStatesByIdsResponse {
    string               message = 1;
    repeated StateDetail states  = 2;
}

// Cities
message GetCitiesByIdsRequest {
    repeated string ids = 1;
}

message CityDetail {
    string id = 1;
    string name     = 2;
    string slug     = 3;
    string state_id = 4;
}

message GetCitiesByIdsResponse {
    string              message = 1;
    repeated CityDetail cities  = 2;
}

message GetCountriesByNamesRequest {
    repeated string names = 1;
}
message GetCountriesByNamesResponse {
    string                 message   = 1;
    repeated CountryDetail countries = 2;
}

message GetStatesByNamesRequest {
    repeated string names       = 1;
    repeated string country_ids = 2;  // optional — narrows to specific countries
}
message GetStatesByNamesResponse {
    string               message = 1;
    repeated StateDetail states  = 2;
}

message GetCitiesByNamesRequest {
    repeated string names     = 1;
    repeated string state_ids = 2;  // optional — narrows to specific states
}
message GetCitiesByNamesResponse {
    string              message = 1;
    repeated CityDetail cities  = 2;
}

message GetAllRolesRequest {}

// A single role record.
message RoleDetail {
    string id = 1;
    string name        = 2;
    string slug        = 3;
    int64  hierarchy   = 4;   // lower = more senior (Admin=1, Agent=8, etc.)
    bool   is_internal = 5;
    bool   is_active   = 6;
    string data_scope  = 7;   // ALL / SUBTREE / OWN
}

// Response containing all active roles.
message GetAllRolesResponse {
    string              message = 1;
    repeated RoleDetail roles   = 2;
}

// ----------------------------- Teams ---------------------------------- //

// A member of a team with the role effective within that team.
message TeamMemberDetail {
    string user_id = 1;
    string effective_role = 2;  // COALESCE(team_member.role_id, user.role_id) slug
    int64  hierarchy      = 3;  // effective role hierarchy
    string data_scope     = 4;  // data_scope of the effective role (ALL/SUBTREE/OWN)
}

// A team with its members.
message TeamDetail {
    string team_id = 1;
    string name           = 2;
    string partner_id = 3;
    string parent_team_id = 4;
    bool   is_internal    = 5;
    repeated TeamMemberDetail members = 6;
}

message GetUserTeamsRequest {
    string user_id = 1;
}

message GetPartnerTeamsRequest {
    string partner_id = 1;
}

message GetTeamMembersRequest {
    string team_id = 1;
}

message GetTeamsResponse {
    string             message = 1;
    repeated TeamDetail teams  = 2;
}

message GetTeamMembersResponse {
    string              message = 1;
    repeated UserDetail members = 2;
}
