syntax = "proto3";

package wallet;

// Wallet component service
service WalletRPCService {

    // Batch wallet lookup
    rpc GetWalletsByPartnerIds (
        GetWalletsByPartnerIdsRequest
    ) returns (
        GetWalletsByPartnerIdsResponse
    );

    // Idempotent per-call debit (talko ledger unification).
    rpc WalletDebit (
        WalletDebitRequest
    ) returns (
        WalletDebitResponse
    );
}


// Single wallet response
message WalletRPCResponse {
    string id = 1;
    string partner_id = 2;
    double balance = 3;
    string currency = 4;
    double frozen_balance = 5;
    bool is_active = 6;
    bool is_wallet_enabled = 7;
    int64 created_at = 8;
    int64 updated_at = 9;
}

// Batch request
message GetWalletsByPartnerIdsRequest {
    repeated string partner_ids = 1;
}

// Batch response
message GetWalletsByPartnerIdsResponse {
    repeated WalletRPCResponse wallets = 1;
}
// Idempotent per-call debit: find-or-debit on attributes.call_id.
message WalletDebitRequest {
    string partner_id = 1;
    double amount = 2;
    string currency = 3;
    string call_id = 4;
    double billed_minutes = 5;
    string description = 6;
}

message WalletDebitResponse {
    string message = 1;
    string transaction_id = 2;
    double amount = 3;
    double remaining_balance = 4;
    bool already_charged = 5;
}
