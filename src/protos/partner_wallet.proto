syntax = "proto3";

package wallet;

// Wallet component service
service WalletRPCService {

    // Batch wallet lookup
    rpc GetWalletsByPartnerIds (
        GetWalletsByPartnerIdsRequest
    ) returns (
        GetWalletsByPartnerIdsResponse
    );
}


// Single wallet response
message WalletRPCResponse {
    int64 id = 1;
    int64 partner_id = 2;
    double balance = 3;
    string currency = 4;
    double frozen_balance = 5;
    bool is_active = 6;
    bool is_wallet_enabled = 7;
    int64 created_at = 8;
    int64 updated_at = 9;
}

// Batch request
message GetWalletsByPartnerIdsRequest {
    repeated int64 partner_ids = 1;
}

// Batch response
message GetWalletsByPartnerIdsResponse {
    repeated WalletRPCResponse wallets = 1;
}