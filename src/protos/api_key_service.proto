syntax = "proto3";

package apikey;

// API Key component service
service ApiKeyService {
    // RPC to validate an API key and retrieve its details
    rpc ValidateApiKey (ValidateApiKeyRequest) returns (ValidateApiKeyResponse);
    rpc GetApiByPartnerId(GetApiKeyPartnerIdRequest) returns (PartnerApiKeyResponse);
}

// Request message for validating an API key
message ValidateApiKeyRequest {
    string key = 1;  // The API key to validate
}

message GetApiKeyPartnerIdRequest {
    string partner_id = 1; // Partner id for get active api key for partne
}

// Response message for validating an API key
message ValidateApiKeyResponse {
    string id = 1;          // Unique ID of the API key
    string key = 2;        // The API key value
    string partner_id = 3;  // Associated partner ID
    bool is_active = 4;    // Whether the key is active
    repeated string scopes = 5;   // Permission slugs granted to this key
    string user_context = 6;      // JSON object (may be empty) about the key's generator
}


message PartnerApiKeyResponse {
    string id = 1;
    string key = 2;
    string description = 3;
    bool is_active = 4;
    string partner_id = 5;
}
